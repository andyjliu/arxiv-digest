name: fetch-arxiv

on:
  schedule:
    # arXiv mailings post ~20:00 ET Sun-Thu; the RSS feed for them is built ~00:00 ET Mon-Fri.
    # Two runs for resilience (GitHub cron can be delayed or skipped); the second is a no-op if nothing changed.
    - cron: "17 6 * * 1-5"
    - cron: "17 10 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Backfill this announcement date (YYYY-MM-DD) via the arXiv API; blank = today's RSS"
        required: false
  # Backfill on request: push a file requests/backfill.txt with one YYYY-MM-DD per line.
  push:
    paths:
      - "requests/backfill.txt"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Diagnose arXiv reachability
        continue-on-error: true
        run: |
          mkdir -p logs
          {
          echo "run: $GITHUB_EVENT_NAME $(date -u)"
          for u in \
            "https://rss.arxiv.org/rss/cs.AI+cs.CL+cs.GT+cs.LG" \
            "https://export.arxiv.org/api/query?search_query=cat:cs.AI&max_results=1" \
            "https://export.arxiv.org/api/query?search_query=cat:cs.AI&sortBy=submittedDate&sortOrder=descending&max_results=1" \
            "https://export.arxiv.org/api/query?search_query=%28cat:cs.AI+OR+cat:cs.CL%29&max_results=1" \
            "https://export.arxiv.org/api/query?search_query=submittedDate:%5B202609231800+TO+202609241800%5D&max_results=1" \
            "https://export.arxiv.org/api/query?search_query=%28cat:cs.AI+OR+cat:cs.CL%29+AND+submittedDate:%5B202609231800+TO+202609241800%5D&max_results=1"; do
            echo "== curl $u"
            curl -g -sS -o /tmp/body -w "status=%{http_code}\n" -A "arxiv-digest/1.1 (personal research digest)" "$u"
            head -c 200 /tmp/body; echo
          done
          } 2>&1 | tee logs/diag.txt
      - name: Fetch
        env:
          INPUT_DATE: ${{ github.event.inputs.date }}
        run: |
          set -o pipefail
          CATS="cs.AI+cs.CL+cs.GT+cs.LG"
          {
          if [ -n "$INPUT_DATE" ]; then
            python fetch.py --cats "$CATS" --date "$INPUT_DATE"
          elif [ "${{ github.event_name }}" = "push" ] && [ -f requests/backfill.txt ]; then
            grep -Eo '^[0-9]{4}-[0-9]{2}-[0-9]{2}' requests/backfill.txt | while read d; do
              python fetch.py --cats "$CATS" --date "$d"; sleep 3
            done
            git rm -q requests/backfill.txt
          else
            python fetch.py --cats "$CATS"
          fi
          } 2>&1 | tee logs/fetch.txt
      - name: Commit data and logs
        if: always()
        run: |
          git config user.name "arxiv-digest-bot"
          git config user.email "arxiv-digest-bot@users.noreply.github.com"
          echo "${{ job.status }} $(date -u)" > logs/status.txt
          git add -A data logs requests 2>/dev/null || git add -A data logs
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "run $GITHUB_RUN_ID: $(cat data/LATEST 2>/dev/null || echo no-data)"
          git pull --rebase -q || true
          git push
