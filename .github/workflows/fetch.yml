name: fetch-arxiv

on:
  schedule:
    # arXiv mailings post ~20:00 ET Sun-Thu; the RSS feed for them is built ~00:00 ET Mon-Fri.
    # Several runs for resilience (GitHub cron is often delayed or skipped); later runs rewrite the same file.
    - cron: "17 5 * * 1-5"
    - cron: "17 7 * * 1-5"
    - cron: "17 9 * * 1-5"
    - cron: "47 10 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Fetch from the listing pages, expecting this announcement date (YYYY-MM-DD); only the latest announcement is available"
        required: false
  # Re-fetch on request: push requests/backfill.txt containing the latest announcement date (YYYY-MM-DD).
  push:
    paths:
      - "requests/backfill.txt"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch
        env:
          INPUT_DATE: ${{ github.event.inputs.date }}
        run: |
          set -o pipefail
          mkdir -p logs
          CATS="cs.AI+cs.CL+cs.GT+cs.LG"
          {
          echo "run: $GITHUB_EVENT_NAME $(date -u)"
          if [ -n "$INPUT_DATE" ]; then
            python fetch.py --cats "$CATS" --listing --expect "$INPUT_DATE"
          elif [ "${{ github.event_name }}" = "push" ] && [ -f requests/backfill.txt ]; then
            # Only the most recent announcement can be recovered (from the /list/<cat>/new pages).
            d=$(grep -Eo '^[0-9]{4}-[0-9]{2}-[0-9]{2}' requests/backfill.txt | tail -1)
            python fetch.py --cats "$CATS" --listing ${d:+--expect "$d"}
            git rm -q requests/backfill.txt
          else
            # RSS first; if it errors, fall back to the listing pages for the same announcement.
            python fetch.py --cats "$CATS" || { echo "RSS failed; trying listing pages"; python fetch.py --cats "$CATS" --listing; }
          fi
          } 2>&1 | grep -Ev '^  (headers|body):' | tee logs/fetch.txt
      - name: Commit data and logs
        if: always()
        run: |
          git config user.name "arxiv-digest-bot"
          git config user.email "arxiv-digest-bot@users.noreply.github.com"
          echo "${{ job.status }} $(date -u)" > logs/status.txt
          git add -A data logs requests 2>/dev/null || git add -A data logs
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "run $GITHUB_RUN_ID: $(cat data/LATEST 2>/dev/null || echo no-data)"
          git pull --rebase -q || true
          git push
