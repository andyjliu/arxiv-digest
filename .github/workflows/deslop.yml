name: deslop-prototype

# Runs the slop check on a list of arXiv IDs and uploads the report.
# It does not commit anything or touch Notion. The repo is public, so the job
# summary and logs carry counts only; paper-level results stay in the artifact.
on:
  # A workflow_dispatch file must be on main to be started by hand, so run on pushes
  # to the prototype branch instead.
  push:
    branches: [deslop-prototype]
    paths:
      - "deslop/**"
      - ".github/workflows/deslop.yml"
  workflow_dispatch:
    inputs:
      ids_file:
        description: "File with one arXiv ID per line"
        default: "deslop/picks/2026-10-28.txt"
      detector:
        description: "Run the EditLens detector (tier 2)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install requests beautifulsoup4 "transformers>=4.40"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-editlens-${{ github.run_id }}
          restore-keys: hf-editlens-
      - uses: actions/cache@v4
        with:
          path: deslop/.cache
          key: deslop-lookups-${{ github.run_id }}
          restore-keys: deslop-lookups-
      - name: Unit tests
        run: python -m unittest discover -s deslop/tests -v
      - name: Check
        env:
          IDS_FILE: ${{ github.event.inputs.ids_file || 'deslop/picks/2026-10-28.txt' }}
          DETECTOR: ${{ github.event.inputs.detector || 'true' }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          FLAG=""
          if [ "$DETECTOR" != "true" ]; then FLAG="--no-detector"; fi
          python deslop/check.py --ids-file "$IDS_FILE" --out deslop/out --cache deslop/.cache/lookups.json $FLAG
          cat deslop/out/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deslop-report
          path: deslop/out/
          retention-days: 3
